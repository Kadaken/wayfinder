[package]
name = "wayfinder"
version = "0.1.0"
description = "A fast, native file manager for Linux with a docked preview pane"
authors = ["LegendofZito"]
license = "LicenseRef-Proprietary"
edition = "2021"
exclude = ["src/guide-names.json"]

# The Tauri/WebKit shell was removed on 2026-08-13. This crate is now a single
# GTK4/libadwaita binary; there is no library target, no build script and no
# JavaScript toolchain. See OLD-VERSION-CARRYOVER.md for what the old shell did.

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adw = { version = "0.9.1", package = "libadwaita", features = [
    "gio_v2_80",
    "gtk_v4_22",
    "v1_9",
] }
gdk-pixbuf = "0.22"
libc = "0.2"
gstreamer = "0.25"
gstreamer-app = "0.25"
sha2 = "0.10"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[features]
default = []
guide = []

[[bin]]
name = "wayfinder-native"
path = "src/native.rs"
