<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 954" width="1024" height="954">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FDC236"/>
      <stop offset="0.55" stop-color="#F8B622"/>
      <stop offset="1"    stop-color="#EFA610"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFDD68"/>
      <stop offset="0.45" stop-color="#FEC947"/>
      <stop offset="0.80" stop-color="#FBB72C"/>
      <stop offset="1"    stop-color="#F5A912"/>
    </linearGradient>
    <linearGradient id="sides" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#B96F00" stop-opacity="0.32"/>
      <stop offset="0.06" stop-color="#B96F00" stop-opacity="0"/>
      <stop offset="0.94" stop-color="#B96F00" stop-opacity="0"/>
      <stop offset="1"    stop-color="#B96F00" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A96A05" stop-opacity="0"/>
      <stop offset="1" stop-color="#A96A05" stop-opacity="0.55"/>
    </linearGradient>

    <clipPath id="faceClip">
      <rect x="8" y="187" width="1008" height="763" rx="100" ry="100"/>
    </clipPath>
  </defs>

  <!-- back panel: tab on the left, shoulder sweeping down to the right -->
  <path fill="url(#back)" stroke="#D08C08" stroke-width="7" stroke-linejoin="round"
        d="M 8 850
           L 8 94
           A 90 90 0 0 1 98 4
           L 344 4
           C 400 4 415 20 438.5 45
           C 462 69 505 114 533 114
           L 952 114
           A 64 64 0 0 1 1016 178
           L 1016 850 Z"/>

  <!-- seam shadow cast by the front panel onto the back -->
  <rect x="8" y="120" width="1008" height="70" fill="url(#seam)"/>

  <!-- front panel -->
  <g clip-path="url(#faceClip)">
    <rect x="8" y="187" width="1008" height="763" fill="url(#face)"/>
    <rect x="8" y="187" width="1008" height="763" fill="url(#sides)"/>
    <!-- inner bevel highlight along the top lip -->
    <path fill="none" stroke="#FFEC9C" stroke-width="12" stroke-opacity="0.85"
          d="M 14 293 A 100 100 0 0 1 114 193 L 910 193 A 100 100 0 0 1 1010 293"/>
  </g>
  <rect x="8" y="187" width="1008" height="763" rx="100" ry="100"
        fill="none" stroke="#D48C07" stroke-width="7"/>
</svg>
