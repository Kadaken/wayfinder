# Flatpak manifest for Wayfinder, the file manager.
#
# Status: written, not yet built here. Building needs the GNOME 50 SDK, about
# two gigabytes of download, so nothing in this file has been proved by a real
# flatpak-builder run. Treat it as a starting point for a packager, not as a
# tested recipe.
#
# Two things a flatpak cannot do:
#   * It cannot be the system file dialog. A portal backend has to own a name
#     on the session bus outside the sandbox, so wayfinder-portal is left out
#     of this build on purpose. The flatpak is the file manager only. Use
#     packaging/install.sh for the file dialog.
#   * It cannot register itself as org.freedesktop.FileManager1 for the host,
#     so "Show in folder" from host apps will not reach it.
#
# The runtime must carry GTK 4.22 or newer and libadwaita 1.9 or newer, which
# is what src-tauri/Cargo.toml asks for. GNOME 50 is the oldest runtime that
# does. Bump both lines together if you move forward.
#
# SPDX-License-Identifier: GPL-3.0-or-later

id: com.kadaken.wayfinder

runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

command: wayfinder

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Sound, for the video and audio preview
  - --socket=pulseaudio
  # A file manager has no useful smaller filesystem permission than the whole
  # host. This is the reason a flatpak of a file manager is a compromise.
  - --filesystem=host
  - --filesystem=xdg-data/Trash:create
  # Opening a file in its own program, and asking the desktop for a file
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.portal.FileChooser
  # Mounting and unmounting drives
  - --system-talk-name=org.freedesktop.UDisks2

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/wayfinder/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: wayfinder
    buildsystem: simple
    build-commands:
      - cargo build --release --offline --manifest-path src-tauri/Cargo.toml
      - install -Dm755 src-tauri/target/release/wayfinder-native /app/bin/wayfinder
      - install -Dm755 scripts/wayfinder-new-window /app/bin/wayfinder-new-window
      - install -Dm644 flatpak/com.kadaken.wayfinder.desktop
          /app/share/applications/com.kadaken.wayfinder.desktop
      - install -Dm644 src-tauri/com.kadaken.wayfinder.metainfo.xml
          /app/share/metainfo/com.kadaken.wayfinder.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/wayfinder/LICENSE
      - install -Dm644 THIRD-PARTY-NOTICES.md
          /app/share/licenses/wayfinder/THIRD-PARTY-NOTICES.md
      - install -Dm644 src-tauri/icons/32x32.png
          /app/share/icons/hicolor/32x32/apps/com.kadaken.wayfinder.png
      - install -Dm644 src-tauri/icons/64x64.png
          /app/share/icons/hicolor/64x64/apps/com.kadaken.wayfinder.png
      - install -Dm644 src-tauri/icons/128x128.png
          /app/share/icons/hicolor/128x128/apps/com.kadaken.wayfinder.png
      - install -Dm644 src-tauri/icons/128x128@2x.png
          /app/share/icons/hicolor/256x256/apps/com.kadaken.wayfinder.png
      - install -Dm644 src-tauri/icons/icon.png
          /app/share/icons/hicolor/512x512/apps/com.kadaken.wayfinder.png
    sources:
      - type: git
        url: https://github.com/LegendofZito/wayfinder.git
        # Point this at the release you are packaging.
        tag: v0.1.0
      # Regenerate whenever Cargo.lock changes:
      #   python3 flatpak-cargo-generator.py src-tauri/Cargo.lock \
      #     -o flatpak/cargo-sources.json
      - cargo-sources.json
